name: ci

on:
  workflow_call:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate JSON files
        run: |
          while IFS= read -r -d '' f; do
            echo "checking $f"
            jq empty "$f"
          done < <(find . -name "*.json" -not -path "*/node_modules/*" \
            -not -path "./tests/fixtures/attempt/*/invalid/parse--*" -print0)

      - name: Validate shell scripts
        run: |
          bash -n install.sh scripts/*.sh tests/*.sh scripts/passdown-attempt tests/harness/*
          shellcheck install.sh scripts/*.sh tests/*.sh scripts/passdown-attempt tests/harness/fake-executor tests/harness/ref-host tests/harness/layer-b/*.sh tests/harness/layer-b/scenarios/*.sh docs/evidence/*.sh

      - name: Check bundled helper and schema copies
        run: ./scripts/sync-bundled.sh --check

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run protocol contract tests
        run: ./tests/contracts.sh

      - name: Install plugin CLIs
        run: |
          npm install -g \
            @anthropic-ai/claude-code@2.1.193 \
            @openai/codex@0.142.5

      - name: Validate plugin + marketplace manifests (strict)
        run: ./scripts/validate-plugin.sh

      - name: Run installer regressions
        run: ./tests/install.sh

      - name: Run doctor regressions
        run: ./tests/doctor.sh

      - name: Run skill contract tests
        run: ./tests/skills.sh

      - name: Check version agreement
        run: ./tests/version.sh

      - name: Check release workflow contracts
        run: ./tests/release.sh

      - name: Check documentation contracts
        run: ./tests/docs.sh

      - name: Smoke-test Codex marketplace install
        run: |
          codex_home="$(mktemp -d)"
          CODEX_HOME="$codex_home" codex plugin marketplace add "$GITHUB_WORKSPACE"
          CODEX_HOME="$codex_home" codex plugin add passdown@passdown
          version="$(cat VERSION)"
          CODEX_HOME="$codex_home" codex plugin list |
            awk -v version="$version" '
              $1 == "passdown@passdown" &&
              $2 == "installed," &&
              $3 == "enabled" &&
              $4 == version { found = 1 }
              END { exit !found }
            '

      - name: Validate passdown OpenSpec schema
        run: |
          scratch="$(mktemp -d)"
          ./install.sh --into "$scratch"
          cd "$scratch"
          npx --yes @fission-ai/openspec@1.5.0 schema validate passdown

      - name: Check the apply instruction a delegated worker receives
        env:
          OPENSPEC: npx --yes @fission-ai/openspec@1.5.0
        run: ./tests/openspec-apply.sh

      - name: Check examples/basic-workspace schema copy is in sync
        run: |
          diff -r schemas/passdown examples/basic-workspace/openspec/schemas/passdown

  helper:
    # The attempt helper on Linux and on macOS's stock bash 3.2.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run helper tests
        run: |
          jq --version
          if [ "$RUNNER_OS" = macOS ]; then /bin/bash --version | head -n 1; /bin/bash tests/attempt.sh; else tests/attempt.sh; fi

  harness:
    # Behavioral harness, Layer A: the interruption matrix F1-F26 through a
    # reference host and a fake executor, plus the mutation check that the
    # suite fails when the writer claim is stubbed out.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run the interruption matrix
        run: |
          if [ "$RUNNER_OS" = macOS ]; then /bin/bash tests/interrupt.sh; else tests/interrupt.sh; fi

  helper-windows:
    # Windows is supported with prerequisites: Git Bash plus a jq the job
    # installs itself (design PDN-0004 section 22). Process probes are not
    # available there, so this runs the platform-independent groups.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install jq
        run: |
          mkdir -p "$RUNNER_TEMP/jq"
          curl -fsSL -o "$RUNNER_TEMP/jq/jq.exe" \
            https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-windows-amd64.exe
          echo "$RUNNER_TEMP/jq" >>"$GITHUB_PATH"

      - name: Run helper tests (conformance and digests)
        run: |
          jq --version
          tests/attempt.sh conformance digests

  helper-stress:
    # Concurrency stress: the concurrent-new race (F19) over 50 rounds, the
    # crash-point sweep (F23) and the receipt compare-and-write race (F25).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run concurrency stress
        env:
          PASSDOWN_STRESS_ROUNDS: '50'
        run: tests/attempt.sh crash races
